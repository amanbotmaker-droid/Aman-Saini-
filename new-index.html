<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Wallet - VIP Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        /* SPIN ANIMATION */
        .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #f59e0b; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* SIDEBAR ANIMATION */
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 100; }
        .side-link { display: flex; align-items: center; gap: 15px; padding: 12px 20px; border-radius: 15px; transition: 0.2s; color: #94a3b8; font-weight: 700; font-size: 13px; }
        .side-link:active { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    </style>
</head>
<body class="bg-[#050505] text-white font-sans flex justify-center overflow-x-hidden">

    <div id="global-loader" class="hidden fixed inset-0 bg-black/90 z-[200] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-xs font-black tracking-widest text-yellow-500 animate-pulse uppercase">Processing VIP Request...</p>
    </div>

    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#0a0a0a] border-r border-yellow-500/20 transform -translate-x-full shadow-2xl overflow-y-auto">
        <div class="p-6 border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-crown text-yellow-500"></i>
                <span class="font-black tracking-widest uppercase italic text-sm">King SideBar</span>
            </div>
            <button onclick="toggleSidebar()" class="text-gray-500"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
                <div class="p-4 space-y-1">
            <a href="javascript:void(0)" onclick="showLoaderAndGo('profile.html')" class="side-link">
                <i class="fa-solid fa-user-circle"></i> Profile
            </a>
            
            <a href="javascript:void(0)" onclick="showLoaderAndGo('api.html')" class="side-link">
                <i class="fa-solid fa-code"></i> API Key & Setting
            </a>

            <a href="javascript:void(0)" onclick="showLoaderAndGo('changepin.html')" class="side-link">
                <i class="fa-solid fa-key"></i> Change Security PIN
            </a>

            <a href="javascript:void(0)" onclick="showLoaderAndGo('bot-alert.html')" class="side-link">
                <i class="fa-solid fa-robot"></i> Connect Tg Id
            </a>

            <a href="javascript:void(0)" onclick="showLoaderAndGo('bulk.html')" class="side-link">
                <i class="fa-solid fa-layer-group"></i> Bulk Transfer
            </a>

            <hr class="border-white/5 my-2">
            
            <a href="https://t.me/K1NG_WALLET" target="_blank" class="side-link">
                <i class="fa-brands fa-telegram"></i> Official Channel
            </a>

            <a href="javascript:void(0)" onclick="showLoaderAndGo('support.html')" class="side-link">
                <i class="fa-solid fa-headset"></i> Support
            </a>

            <a href="javascript:void(0)" onclick="handleLogout()" class="side-link text-red-500 mt-auto border-t border-white/5 pt-4">
               <i class="fa-solid fa-right-from-bracket"></i> Logout Account
           </a>
         </div>
    </div>

    <div class="w-full max-w-md min-h-screen relative pb-24 border-x border-slate-900">
        
        <div class="px-6 py-6 flex justify-between items-center">
            <button onclick="toggleSidebar()" class="h-10 w-10 rounded-xl glass-card flex items-center justify-center text-yellow-500 border border-yellow-500/20">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <div class="text-center">
                <h1 class="text-sm font-black tracking-tighter uppercase italic">King Wallet</h1>
            </div>
            <button class="h-10 w-10 rounded-full glass-card flex items-center justify-center text-sky-400 border border-sky-500/20">
                <i class="fa-solid fa-bell"></i>
            </button>
        </div>

        <div class="px-6">
            <div class="relative w-full h-44 rounded-[30px] overflow-hidden shadow-2xl p-6 flex flex-col justify-between border border-white/10 bg-gradient-to-br from-slate-900 to-black">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500/10 blur-[40px]"></div>
                <div>
                    <p class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">Available Balance</p>
                    <h2 id="main-balance" class="text-4xl font-black italic mt-1">₹0.00</h2>
                </div>
                <div class="flex justify-between items-center">
                    <p class="text-[10px] font-black text-yellow-500 tracking-[3px]">VIP ACCOUNT</p>
                    <div class="h-8 w-12 bg-white/5 rounded-lg border border-white/10 flex items-center justify-center italic font-black text-[10px]">KING</div>
                </div>
            </div>
        </div>

        <div class="px-6 mt-8 grid grid-cols-4 gap-4 text-center">
            <div onclick="showLoaderAndGo('p2p.html')" class="flex flex-col items-center gap-2">
                <div class="h-14 w-14 bg-yellow-500 rounded-2xl flex items-center justify-center text-black text-xl shadow-lg shadow-yellow-600/30"><i class="fa-solid fa-paper-plane"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase">Pay</span>
            </div>
            <div onclick="showLoaderAndGo('add-fund.html')" class="flex flex-col items-center gap-2">
                <div class="h-14 w-14 bg-sky-500 rounded-2xl flex items-center justify-center text-black text-xl shadow-lg shadow-sky-600/30"><i class="fa-solid fa-plus"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase">Add</span>
            </div>
            <div onclick="showLoaderAndGo('withdraw.html')" class="flex flex-col items-center gap-2">
                <div class="h-14 w-14 bg-slate-800 rounded-2xl flex items-center justify-center text-yellow-500 text-xl"><i class="fa-solid fa-bank"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase">Bank</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="h-14 w-14 bg-slate-800 rounded-2xl flex items-center justify-center text-sky-400 text-xl"><i class="fa-solid fa-qrcode"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase">Scan</span>
            </div>
        </div>

        <div class="px-6 mt-10">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[11px] font-black uppercase tracking-widest text-gray-500">Recent Transactions</h3>
                <i class="fa-solid fa-arrow-right-long text-yellow-500"></i>
            </div>
            <div id="txn-list" class="space-y-3">
                <p class="text-center text-[10px] text-gray-600 py-10">Loading your activity...</p>
            </div>
        </div>

        <div class="fixed bottom-0 w-full max-w-md bg-black/90 backdrop-blur-xl border-t border-white/5 px-8 py-4 flex justify-between items-center">
            <i class="fa-solid fa-house text-yellow-500 text-xl"></i>
            <i class="fa-solid fa-chart-pie text-gray-600 text-xl"></i>
            <div class="h-14 w-14 gold-gradient rounded-full flex items-center justify-center text-black text-2xl -mt-12 border-[6px] border-[#050505] shadow-lg shadow-yellow-500/30"><i class="fa-solid fa-bolt"></i></div>
            <i class="fa-solid fa-wallet text-gray-600 text-xl"></i>
            <i class="fa-solid fa-circle-user text-gray-600 text-xl"></i>
        </div>
    </div>

    <script type="module">
        // API LOGIC (DO NOT CHANGE)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6mIZMGZ3mAgJ4yppLcquQuZLA-b3zDGk",
            authDomain: "kingwallet-d300d.firebaseapp.com",
            projectId: "kingwallet-d300d",
            storageBucket: "kingwallet-d300d.firebasestorage.app",
            messagingSenderId: "79592887664",
            appId: "1:79592887664:web:fadf1e6ed0b56c70baabb5"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Sidebar Control
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            sb.style.transform = sb.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
        };

        // Spin Animation Redirect
        window.showLoaderAndGo = (url) => {
            document.getElementById('global-loader').classList.remove('hidden');
            setTimeout(() => { window.location.href = url; }, 800);
        };
        window.handleLogout = () => {
    // User se confirm pucho
    if(confirm("Bhai, kya aap sach mein Logout karna chahte hain?")) {
        
        // VIP Spinner dikhao
        const loader = document.getElementById('global-loader');
        loader.classList.remove('hidden');
        
        // Spinner ke niche text badal do (Optional)
        const loaderText = loader.querySelector('p');
        if(loaderText) loaderText.innerText = "Securing Session & Logging Out...";

        setTimeout(() => {
            // Browser se user ka data hatao
            localStorage.removeItem('userPhone');
            localStorage.removeItem('isLoggedIn'); // Agar login check ke liye use karte ho toh
            
            // Wapas Login page par bhej do
            window.location.href = 'login.html';
        }, 1500); // 1.5 second ka delay VIP feel ke liye
    }
};

        // Real-time Balance & History
        const myPhone = localStorage.getItem('userPhone');
        if(myPhone) {
            onSnapshot(doc(db, "users", myPhone), (doc) => {
                if(doc.exists()) document.getElementById('main-balance').innerText = "₹" + (doc.data().balance || 0).toFixed(2);
            });

const q = query(
    collection(db, "transactions"), 
    where("userPhone", "==", myPhone) 
);

onSnapshot(q, (snapshot) => {
    const list = document.getElementById('txn-list');
    list.innerHTML = ''; 

    if(snapshot.empty) {
        list.innerHTML = '<p class="text-center text-[10px] text-gray-600 py-10 uppercase font-black tracking-widest">No Recent Activity</p>';
        return;
    }

    let txns = [];
    snapshot.forEach(doc => txns.push(doc.data()));
    
    // Latest ko top par lane ke liye sort karo
    txns.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    txns.forEach((txn) => {
        // Default Variables
        let icon = 'fa-exchange-alt';
        let iconColor = 'text-gray-400';
        let borderColor = 'border-gray-500/50';
        let title = txn.type || 'Transaction';
        let prefix = '₹';
        
        // Safety ke liye uppercase mein convert
        const tType = txn.type ? txn.type.toUpperCase() : '';

        // --- TYPE DETECTION & LOGIC ---

        // 1. DEPOSIT (Paisa Aaya)
        if (tType === 'DEPOSIT') {
            icon = 'fa-arrow-down'; iconColor = 'text-sky-400'; borderColor = 'border-sky-500/50';
            title = 'Wallet Deposit'; prefix = '+ ₹';
        } 
        // 2. WITHDRAW (Paisa Gaya)
        else if (tType === 'WITHDRAW') {
            icon = 'fa-arrow-up'; iconColor = 'text-red-400'; borderColor = 'border-red-500/50';
            title = 'Withdrawal'; prefix = '- ₹';
        } 
        // 3. PAY SEND (Paisa Bheja)
        else if (tType === 'PAY_SEND' || tType === 'SEND') {
            icon = 'fa-paper-plane'; iconColor = 'text-red-400'; borderColor = 'border-red-500/50';
            title = `Paid to ${txn.receiver || 'User'}`; prefix = '- ₹';
        } 
        // 4. PAY RECEIVE (Paisa Mila)
        else if (tType === 'PAY_RECEIVE' || tType === 'RECEIVE') {
            icon = 'fa-hand-holding-dollar'; iconColor = 'text-green-400'; borderColor = 'border-green-500/50';
            title = `From ${txn.sender || 'User'}`; prefix = '+ ₹';
        } 
        // 5. BULK SEND (Ek sath bheja)
        else if (tType === 'BULK_SEND') {
            icon = 'fa-layer-group'; iconColor = 'text-orange-400'; borderColor = 'border-orange-500/50';
            title = 'Bulk Transfer Sent'; prefix = '- ₹';
        } 
        // 6. BULK RECEIVE (Ek sath mila)
        else if (tType === 'BULK_RECEIVE') {
            icon = 'fa-boxes-packing'; iconColor = 'text-green-400'; borderColor = 'border-green-500/50';
            title = 'Bulk Transfer Received'; prefix = '+ ₹';
        } 
        // 7. API SEND (API se kata)
        else if (tType === 'API_SEND') {
            icon = 'fa-code-compare'; iconColor = 'text-purple-400'; borderColor = 'border-purple-500/50';
            title = 'API Payment Sent'; prefix = '- ₹';
        } 
        // 8. API RECEIVE (API se aaya)
        else if (tType === 'API_RECEIVE') {
            icon = 'fa-laptop-code'; iconColor = 'text-green-400'; borderColor = 'border-green-500/50';
            title = 'API Payment Received'; prefix = '+ ₹';
        }

        // Status Colors (Pending = Yellow, Success = Green, Failed = Red)
        const statusColor = txn.status === 'SUCCESS' ? 'text-green-400' : (txn.status === 'PENDING' ? 'text-yellow-500' : 'text-red-500');

        // Card Render
        list.innerHTML += `
            <div class="glass-card p-4 rounded-2xl flex justify-between items-center border-l-2 ${borderColor} mb-3 shadow-lg">
                <div class="flex items-center gap-3">
                    <div class="h-9 w-9 rounded-full flex items-center justify-center bg-white/5 text-[10px] ${iconColor}">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-[11px] font-black uppercase gold italic tracking-tight">${prefix}${txn.amount}</p>
                        <p class="text-[7.5px] text-gray-400 font-bold uppercase truncate w-32 mt-0.5 tracking-wider">${title}</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[8.5px] font-black uppercase ${statusColor} tracking-widest">${txn.status || 'SUCCESS'}</p>
                    <p class="text-[6.5px] text-gray-500 mt-1 font-bold uppercase tracking-wider">${txn.date || 'Processing'}</p>
                </div>
            </div>
        `;
    });
});
    </script>
</body>
</html>
