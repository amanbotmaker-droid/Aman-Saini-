<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Mega Lifafa - King Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .type-card.active { border-color: #2563eb; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <div class="bg-white shadow-sm sticky top-0 z-50 p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center active:scale-95">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-lg font-black">Create Giveaway</h1>
        </div>
        <button onclick="Swal.fire('Coming Soon', 'History page is under construction!', 'info')" class="bg-blue-100 text-blue-700 px-3 py-2 rounded-xl text-xs font-bold active:scale-95">
            <i class="fa-solid fa-envelope-open-text mr-1"></i> My Lifafa
        </button>
    </div>

    <div class="p-4 space-y-6">

        <div>
            <h2 class="text-sm font-bold mb-3 text-slate-500">1. CHOOSE LIFAFA TYPE</h2>
            <div class="grid grid-cols-3 gap-2">
                <div class="type-card active border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer transition-all" onclick="window.selectType(this, 'normal')">
                    <i class="fa-solid fa-gift text-2xl mb-1 text-orange-500"></i>
                    <p class="text-[11px] font-bold">Normal</p>
                </div>
                <div class="type-card border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer transition-all" onclick="window.selectType(this, 'toss')">
                    <i class="fa-solid fa-coins text-2xl mb-1 text-yellow-500"></i>
                    <p class="text-[11px] font-bold">Toss To Win</p>
                </div>
                <div class="type-card border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer transition-all" onclick="window.selectType(this, 'scratch')">
                    <i class="fa-solid fa-ticket text-2xl mb-1 text-green-500"></i>
                    <p class="text-[11px] font-bold">Scratch Card</p>
                </div>
            </div>
            <input type="hidden" id="lifafa-type" value="normal">
        </div>

        <div>
            <h2 class="text-sm font-bold mb-3 text-slate-500">2. GIVEAWAY DETAILS</h2>
            <input type="text" id="title" placeholder="Giveaway Title (e.g., King Mega Loot)" class="w-full p-4 mb-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-blue-500 font-bold">
            
            <div class="flex gap-3 mb-3">
                <div class="w-1/2">
                    <label class="text-[10px] font-bold text-slate-400 pl-2">Total Users</label>
                    <input type="number" id="total-users" placeholder="100" class="w-full p-4 border border-slate-200 rounded-2xl focus:outline-none focus:border-blue-500 font-bold" oninput="window.calculateTotal()">
                </div>
                <div class="w-1/2">
                    <label class="text-[10px] font-bold text-slate-400 pl-2">Per User (₹)</label>
                    <input type="number" id="per-amount" placeholder="10" class="w-full p-4 border border-slate-200 rounded-2xl focus:outline-none focus:border-blue-500 font-bold" oninput="window.calculateTotal()">
                </div>
            </div>
            <input type="text" id="access-code" placeholder="Access Code (Leave blank for public)" class="w-full p-4 border border-slate-200 rounded-2xl focus:outline-none focus:border-blue-500 font-bold text-center tracking-widest uppercase">
        </div>

        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-slate-500">3. JOIN CHANNELS (Max 5)</h2>
                <button onclick="window.addChannel()" class="text-blue-600 text-xs font-bold bg-blue-50 px-2 py-1 rounded-lg">+ Add More</button>
            </div>
            <div id="channels-container" class="space-y-2">
                <input type="text" id="channel-1" class="channel-input w-full p-3 border border-slate-200 rounded-xl focus:outline-none text-sm" placeholder="Channel 1 Link (e.g., t.me/kingwallet)" onblur="window.verifyBotIsAdmin(this.value, 'channel-1')">
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
            <div class="flex justify-between items-center cursor-pointer" onclick="window.toggleReferral()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-users text-blue-600 text-lg"></i>
                    <h2 class="text-sm font-bold">Enable Refer & Earn</h2>
                </div>
                <div id="ref-toggle" class="w-10 h-6 bg-slate-300 rounded-full flex items-center p-1 transition-all">
                    <div class="w-4 h-4 bg-white rounded-full shadow-md transform transition-transform"></div>
                </div>
            </div>
            
            <div id="referral-settings" class="hidden mt-4 pt-4 border-t border-slate-100 grid grid-cols-1 gap-3">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 pl-1">Referrer Gets (₹)</label>
                    <input type="number" id="ref-creator-amount" placeholder="e.g. 5" class="w-full p-3 border border-slate-200 rounded-xl text-sm font-bold mt-1">
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-sm font-bold mb-3 text-slate-500">4. ADVANCED OPTIONS</h2>
            <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-2xl bg-white mb-2 cursor-pointer">
                <input type="checkbox" id="bot-alert" class="w-5 h-5 text-blue-600 rounded">
                <span class="text-sm font-bold">Send Alert to Bot Channel</span>
            </label>
            <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-2xl bg-white cursor-pointer">
                <input type="checkbox" id="show-receipt" checked class="w-5 h-5 text-blue-600 rounded">
                <span class="text-sm font-bold">Generate Transaction Receipt</span>
            </label>
        </div>

    </div>

    <div class="fixed bottom-0 w-full bg-white border-t border-slate-200 p-4 pb-6 flex justify-between items-center z-50 max-w-md">
        <div>
            <p class="text-[11px] font-bold text-slate-400">Total Deduction</p>
            <h2 class="text-2xl font-black text-slate-800" id="total-cost-display">₹0</h2>
        </div>
        <button id="create-btn" class="bg-blue-600 text-white font-black px-8 py-3 rounded-2xl shadow-lg shadow-blue-200 active:scale-95 transition-all">
            CREATE NOW <i class="fa-solid fa-rocket ml-1"></i>
        </button>
    </div>

    <script type="module">
        import { db, doc, collection, runTransaction, serverTimestamp } from "/js/Backend.js";
        // --- 🚀 VIP LOGIN SECURITY ENGINE 🚀 ---
        const myPhone = localStorage.getItem('userPhone');
        if (!myPhone) {
            window.location.href = 'index.html'; // Bina login ke seedha bahar!
        }

        // Global UI State
        let referEnabled = false;
        let channelCount = 1;

        // UI Functions (Attached to window for HTML access)
        window.selectType = function(element, type) {
            document.querySelectorAll('.type-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('lifafa-type').value = type;
        };

        window.calculateTotal = function() {
            const users = Number(document.getElementById('total-users').value) || 0;
            const amt = Number(document.getElementById('per-amount').value) || 0;
            
            // 🚀 Referral ka paisa check karo (agar ON hai)
            let extraRefAmt = 0;
            if (referEnabled) {
                const cAmt = Number(document.getElementById('ref-creator-amount').value) || 0;
                extraRefAmt = cAmt;
            }
            
            const finalTotal = users * (amt + extraRefAmt);
            document.getElementById('total-cost-display').innerText = "₹" + finalTotal;
        };

        // Referral amount type karte hi live price change karne ke liye listeners
        document.getElementById('ref-creator-amount').addEventListener('input', window.calculateTotal);
        
                // --- YAHAN SE PASTE KARO (Line 143 ki jagah) ---

        // 1. Bot Verification Engine
        const ALERT_BOT_TOKEN = "8581810453:AAHyYOYyuadAH-Lv26zv7q7QgTBTeoy4SmY"; // Apna Bot Token yahan daalna
        const ALERT_BOT_USERNAME = "KingPayAlertBot"; // Apna Bot Username yahan daalna (bina @ ke)

        window.verifyBotIsAdmin = async function(channelLink, inputElementId) {
            const inputEl = document.getElementById(inputElementId);
            if(!inputEl) return;
            let channelId = channelLink.trim();

            if(!channelId) return;

            // Link ko @username format mein badalna
            channelId = channelId.replace("https://t.me/", "@").replace("t.me/", "@");
            if(!channelId.startsWith("@")) channelId = "@" + channelId;

            inputEl.disabled = true;
            const originalPlaceholder = inputEl.placeholder;
            inputEl.placeholder = "Checking Bot Admin Status...";

            const url = `https://api.telegram.org/bot${ALERT_BOT_TOKEN}/getChatAdministrators?chat_id=${channelId}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.ok) {
                    Swal.fire("Verified! ✅", `Bot is admin in ${channelId}`, "success");
                    inputEl.style.borderColor = "green";
                } else {
                    inputEl.value = "";
                    inputEl.style.borderColor = "red";
                    Swal.fire({
                        title: "Bot Not Admin ❌",
                        html: `Is channel ko add karne ke liye pehle hamare bot <b>@${ALERT_BOT_USERNAME}</b> ko apne channel mein Admin banayein.<br><br>
                        <a href="https://t.me/${ALERT_BOT_USERNAME}" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold mt-3 inline-block">Go to Bot</a>`,
                        icon: "error"
                    });
                }
            } catch (e) {
                Swal.fire("Error", "Network issue or invalid channel", "error");
            } finally {
                inputEl.disabled = false;
                inputEl.placeholder = originalPlaceholder;
            }
        };

        // 2. Updated Add Channel Function (Jo naye dabbon par verify lagayega)
        window.addChannel = function() {
            if (channelCount >= 5) {
                Swal.fire("Limit Reached", "Maximum 5 channels allowed!", "warning");
                return;
            }
            channelCount++;
            const container = document.getElementById('channels-container');
            const input = document.createElement('input');
            input.type = 'text';
            input.id = `channel-${channelCount}`; // Naya ID diya hai
            input.className = 'channel-input w-full p-3 border border-slate-200 rounded-xl focus:outline-none text-sm mt-2';
            input.placeholder = `Channel ${channelCount} Link`;
            
            // Jaise hi user link daal kar bahar click karega, verification start ho jayega
            input.onblur = function() { window.verifyBotIsAdmin(this.value, this.id); };
            
            container.appendChild(input);
        };
        // --- YAHAN TAK PASTE KARO ---

        window.toggleReferral = function() {
            referEnabled = !referEnabled;
            const toggleBtn = document.getElementById('ref-toggle');
            const innerCircle = toggleBtn.querySelector('div');
            const settings = document.getElementById('referral-settings');

            if (referEnabled) {
                toggleBtn.classList.replace('bg-slate-300', 'bg-blue-600');
                innerCircle.classList.add('translate-x-4');
                settings.classList.remove('hidden');
            } else {
                toggleBtn.classList.replace('bg-blue-600', 'bg-slate-300');
                innerCircle.classList.remove('translate-x-4');
                settings.classList.add('hidden');
            }
                window.calculateTotal(); // 🚀 VIP FIX: ON/OFF karte hi live price update
        };

        // Core Creation Logic
        document.getElementById('create-btn').addEventListener('click', async () => {
            const myPhone = localStorage.getItem('userPhone');
            if (!myPhone) return Swal.fire("Error", "Please login first!", "error");

            const type = document.getElementById('lifafa-type').value;
            const title = document.getElementById('title').value;
            const totalUsers = Number(document.getElementById('total-users').value);
            const perAmount = Number(document.getElementById('per-amount').value);
            const accessCode = document.getElementById('access-code').value.trim();
            const botAlert = document.getElementById('bot-alert').checked;
            const showReceipt = document.getElementById('show-receipt').checked;
            
             const refCreatorAmt = Number(document.getElementById('ref-creator-amount').value) || 0;
            // 🚀 VIP BUG FIX: Asli Total Cost Calculation
            let extraPerUser = 0;
            if (referEnabled) { extraPerUser = refCreatorAmt; }
            
            const totalCost = totalUsers * (perAmount + extraPerUser);

            if (!title || totalUsers <= 0 || perAmount <= 0) {
                return Swal.fire("Incomplete Details", "Please fill Title, Users, and Amount properly.", "warning");
            }

            // Gather Channels
            const channelInputs = document.querySelectorAll('.channel-input');
            let channelsArray = [];
            channelInputs.forEach(input => {
                if(input.value.trim() !== "") channelsArray.push(input.value.trim());
            });

            // Start Firebase Transaction
            const btn = document.getElementById('create-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> CREATING...';
            btn.disabled = true;

            try {
                const userRef = doc(db, "users", myPhone);
                const newLifafaRef = doc(collection(db, "lifafas"));
                const historyRef = doc(collection(db, "transactions")); // Match your collection name

                await runTransaction(db, async (transaction) => {
                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw "User account not found!";

                    const currentBalance = Number(userSnap.data().balance);
                    if (currentBalance < totalCost) throw "Insufficient Balance!";

                    // 1. Deduct Balance
                    transaction.update(userRef, { balance: currentBalance - totalCost });

                    // 2. Create Lifafa Document
                    transaction.set(newLifafaRef, {
                        creatorPhone: myPhone,
                        type: type,
                        title: title,
                        totalUsers: totalUsers,
                        perAmount: perAmount,
                        totalAmount: totalCost,
                        claimedUsers: 0,
                        accessCode: accessCode,
                        channels: channelsArray,
                        referral: {
                            enabled: referEnabled,
                            creatorGets: refCreatorAmt,
                            userGets: 0,
                        },
                        settings: {
                            botAlert: botAlert,
                            showReceipt: showReceipt
                        },
                        status: "active",
                        createdAt: serverTimestamp()
                    });

                                        // 3. Create Transaction History (P2P Style Match)
                    transaction.set(historyRef, {
                        userPhone: myPhone, 
                        receiver: "Lifafa System",
                        amount: Number(totalCost),
                        type: 'LIFAFA_CREATE', 
                        status: 'SUCCESS',
                        date: new Date().toLocaleString('en-IN'), 
                        timestamp: Date.now() 
                    });
                });

                // --- YAHAN SE PASTE KARO ---
                const lifafaId = newLifafaRef.id;
                const shareLink = `${window.location.origin}/claim_lifafa.html?id=${lifafaId}`;

                Swal.fire({
                    title: "Lifafa Live! 🚀",
                    // Dhyan de: Yahan Backtick ( ` ) use hua hai, single quote (') nahi
                    html: `
                        <p class="mb-4">Aapka giveaway ban gaya hai. Ise share karein:</p>
                        <input id="share-url" type="text" value="${shareLink}" readonly class="w-full p-2 border rounded bg-slate-50 text-sm mb-2 text-center text-blue-600 font-bold">
                        <button onclick="copyLifafaLink()" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold active:scale-95">Copy Link</button>
                    `,
                    icon: "success",
                    confirmButtonText: "Done",
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = "index.html";
                });

            } catch (error) {
                console.error("Lifafa Error: ", error);
                Swal.fire("Transaction Failed", error.toString(), "error");
                btn.innerHTML = 'CREATE NOW <i class="fa-solid fa-rocket ml-1"></i>';
                btn.disabled = false;
            }
        });

        // Copy function ko try-catch aur click listener ke bahar global scope mein lagao
        window.copyLifafaLink = function() {
            const copyText = document.getElementById("share-url");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            Swal.fire("Copied!", "Link has been copied to clipboard.", "success");
        };
        // --- YAHAN TAK PASTE KARO ---

    </script>
</body>
</html>
