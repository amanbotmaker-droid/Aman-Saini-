<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - King Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; overflow-y: auto; overflow-x: hidden; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .gold { color: #f59e0b; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: #f59e0b; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input:focus { border-color: #f59e0b !important; outline: none; box-shadow: 0 0 15px rgba(245, 158, 11, 0.1); }
    </style>
        <!-- 👑 MASTER THEME ENGINE 👑 -->
    <script>
    (function() {
        // 10+ VIP Colors Setup
        const themes = {
            'gold': { 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
            'skyblue': { 300: '#e0f2fe', 400: '#7dd3fc', 500: '#0ea5e9', 600: '#0284c7' }, // Tera Favourite
            'emerald': { 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669' },
            'pink': { 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777' },
            'purple': { 300: '#d8b4fe', 400: '#c084fc', 500: '#a855f7', 600: '#9333ea' },
            'red': { 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626' },
            'cyan': { 300: '#67e8f9', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
            'orange': { 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
            'blue': { 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
            'silver': { 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569' }
        };

        const currentTheme = localStorage.getItem('king_theme') || 'gold';
        const t = themes[currentTheme];

        // Agar theme Gold nahi hai, toh automatic CSS inject karke pure app ka colour badal do
        if (currentTheme !== 'gold') {
            const style = document.createElement('style');
            style.id = 'vip-theme-engine';
            style.innerHTML = `
                :root { --t-300: ${t[300]}; --t-400: ${t[400]}; --t-500: ${t[500]}; --t-600: ${t[600]}; }
                
                /* Text Overrides */
                .text-yellow-300, .text-yellow-400 { color: var(--t-400) !important; }
                .text-yellow-500, .gold { color: var(--t-500) !important; }
                .text-yellow-600 { color: var(--t-600) !important; }
                .text-yellow-500\\/70 { color: color-mix(in srgb, var(--t-500) 70%, transparent) !important; }
                .text-yellow-500\\/80 { color: color-mix(in srgb, var(--t-500) 80%, transparent) !important; }
                
                /* Background Overrides */
                .bg-yellow-400 { background-color: var(--t-400) !important; }
                .bg-yellow-500 { background-color: var(--t-500) !important; }
                .bg-yellow-600 { background-color: var(--t-600) !important; }
                .bg-yellow-500\\/10 { background-color: color-mix(in srgb, var(--t-500) 10%, transparent) !important; }
                .bg-yellow-500\\/20 { background-color: color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                
                /* Border & Gradient Overrides */
                .border-yellow-400 { border-color: var(--t-400) !important; }
                .border-yellow-500 { border-color: var(--t-500) !important; }
                .border-yellow-600 { border-color: var(--t-600) !important; }
                .border-yellow-500\\/20 { border-color: color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                .border-yellow-500\\/30 { border-color: color-mix(in srgb, var(--t-500) 30%, transparent) !important; }
                .border-yellow-500\\/50 { border-color: color-mix(in srgb, var(--t-500) 50%, transparent) !important; }
                
                .from-yellow-300 { --tw-gradient-from: var(--t-300) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
                .from-yellow-400 { --tw-gradient-from: var(--t-400) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
                .from-yellow-500 { --tw-gradient-from: var(--t-500) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
                .to-yellow-600 { --tw-gradient-to: var(--t-600) !important; }
                .to-yellow-500 { --tw-gradient-to: var(--t-500) !important; }
                
                /* Shadows & Glows */
                [class*="shadow-[0_0_10px_rgba(234,179,8"] { box-shadow: 0 0 10px color-mix(in srgb, var(--t-500) 30%, transparent) !important; }
                [class*="shadow-[0_0_15px_rgba(245,158,11"] { box-shadow: 0 0 15px color-mix(in srgb, var(--t-500) 30%, transparent) !important; }
                [class*="shadow-[0_0_20px_rgba(245,158,11"] { box-shadow: 0 0 20px color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                [class*="shadow-[0_10px_30px_rgba(234,179,8"] { box-shadow: 0 10px 30px color-mix(in srgb, var(--t-500) 15%, transparent) !important; }
                [class*="shadow-[0_0_40px_rgba(234,179,8"] { box-shadow: 0 0 40px color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                [class*="shadow-[0_5px_15px_rgba(234,179,8"] { box-shadow: 0 5px 15px color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                
                /* Extra Specific fixes */
                .theme-icon-dynamic { color: var(--t-500) !important; }
            `;
            document.head.appendChild(style);
        }

        window.setKingTheme = (themeName) => {
            localStorage.setItem('king_theme', themeName);
            window.location.reload(); // Set hote hi turant page refresh hokar naya colour aayega
        }
    })();
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="auth-loader" class="hidden fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-[10px] font-black tracking-widest gold uppercase animate-pulse">Verifying Credentials...</p>
    </div>

    <div class="w-full max-w-md space-y-8">
        <div class="text-center">
            <div class="h-20 w-20 bg-yellow-500/10 rounded-[2rem] flex items-center justify-center mx-auto border border-yellow-500/20 mb-4">
                <i class="fa-solid fa-crown text-4xl gold"></i>
            </div>
            <h1 class="text-2xl font-black gold italic uppercase tracking-widest">King Wallet</h1>
            <p class="text-[10px] text-gray-500 uppercase font-bold tracking-[3px] mt-1">Merchant Login</p>
        </div>

        <div class="glass p-8 rounded-[2.5rem] border-white/5 space-y-5">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-500 uppercase ml-2 tracking-widest">Phone Number</label>
                <input type="number" id="phone" placeholder="+91 00000 00000" 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm font-bold text-yellow-500">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-500 uppercase ml-2 tracking-widest">Security PIN</label>
                <input type="password" id="pin" maxlength="4" placeholder="Enter 4-Digit PIN" 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm font-bold text-center tracking-[10px] text-yellow-500">
            </div>

                        <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-500 uppercase ml-2 tracking-widest">Master Password</label>
                <input type="password" id="password" placeholder="Enter Password" 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm font-bold text-center tracking-[5px] text-yellow-500">
            </div>

            <button onclick="handleLogin()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl shadow-lg shadow-yellow-600/20 active:scale-95 transition-all uppercase tracking-widest text-xs">
                Access Dashboard
            </button>
        </div>

        <p class="text-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">
            New Merchant? <a href="index.html?register=true" class="gold">Create King Account</a>
        </p>
                <!-- Naya Password Banane Ka Box (Hidden by default) -->
        <div id="create-password-section" class="hidden glass p-8 rounded-[2.5rem] border-white/5 space-y-5 mt-4">
            <h2 class="text-lg font-black gold text-center uppercase tracking-widest"><i class="fa-solid fa-lock"></i> Set VIP Password</h2>
            <p class="text-[10px] text-gray-400 text-center uppercase tracking-widest">Need: 1 Capital, 1 Number, 1 Special (@,#), Min 8 chars</p>
            <div class="space-y-2">
                <input type="text" id="new-password" placeholder="e.g. 97@Dipak" 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm font-bold text-center tracking-[2px] text-emerald-400">
            </div>
            <button onclick="window.saveNewPassword()" class="w-full bg-emerald-500 text-black font-black py-4 rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-95 transition-all uppercase tracking-widest text-xs">
                Save & Login
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
         import { getFirestore, doc, getDoc,updateDoc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw6aKP8je-DzvengJ-ffxtez6xZFpQFn4",
  authDomain: "king-wallet-49888.firebaseapp.com",
  projectId: "king-wallet-49888",
  storageBucket: "king-wallet-49888.firebasestorage.app",
  messagingSenderId: "698310935797",
  appId: "1:698310935797:web:85e03b49237225a7b371bc",
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async () => {
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const password = document.getElementById('password').value.trim();

            if(!phone || !pin) return alert("Bhai, Phone aur PIN dalo!");

            document.getElementById('auth-loader').classList.remove('hidden');

            try {
                let searchPh = phone.length === 10 ? "+91" + phone : phone;
                window.tempPhone = searchPh; // Isko naya password save karne ke liye hold kiya hai
                
                const userDoc = await getDoc(doc(db, "users", searchPh));

                if(userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    // 1. PIN Verify Karega
                    if(userData.pin.toString() === pin.toString()) {
                        
                        // 2. Check karega ki database me Password hai ya nahi
                        if(userData.password) {
                            if(!password) {
                                alert("❌ Bhai, apna Master Password bhi daal!");
                            } else if(userData.password === password) {
                                // Boss Login Success
                                localStorage.setItem('userPhone', searchPh);
                                localStorage.setItem('isLoggedIn', 'true');
                                localStorage.setItem('ultra_user', JSON.stringify(userData)); 
                                window.location.href = 'index.html';
                            } else {
                                alert("❌ Galat Password!");
                            }
                        } else {
                            // 🔥 VIP SWEET ALERT JADOO
                            Swal.fire({
                                title: 'VIP Security Update!',
                                text: 'System safe rakhne ke liye apna naya Master Password set karein.',
                                icon: 'info',
                                background: '#111827', // Dark Blackish background
                                color: '#f59e0b', // Golden Text
                                confirmButtonColor: '#d97706', // Golden Button
                                confirmButtonText: '<i class="fa-solid fa-lock"></i> Set Password',
                                customClass: {
                                    popup: 'border border-yellow-500/30 rounded-[2rem] shadow-[0_0_20px_rgba(245,158,11,0.2)]'
                                }
                            }).then(() => {
                                // Alert me 'Set Password' dabane ke baad box open hoga aur scroll hoga
                                const passBox = document.getElementById('create-password-section');
                                passBox.classList.remove('hidden');
                                setTimeout(() => {
                                    passBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }, 100);
                            });
                        }
                    } else {
                        alert("❌ Galat PIN hai bhai!");
                    }
                } else {
                    alert("❌ Account nahi mila! Pehle Register karein.");
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
            document.getElementById('auth-loader').classList.add('hidden');
        };

        // 🔥 Naya Password Save Karne ka Boss Logic
        window.saveNewPassword = async () => {
            const newPassword = document.getElementById('new-password').value.trim();
            
            // SECURITY FILTER: Kam se kam 8 letter, 1 Capital, 1 Number, aur 1 Special character (jaise 97@Dipak)
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            
            if(!passwordRegex.test(newPassword)) {
                return alert("❌ Password bhari nahi hai! Kam se kam 8 letters, 1 Capital word, 1 Number aur 1 Special character (@,#) zaroori hai (Example: 97@Dipak).");
            }

            document.getElementById('auth-loader').classList.remove('hidden');

            try {
                // Firebase me update maaro
                const userRef = doc(db, "users", window.tempPhone);
                await updateDoc(userRef, { password: newPassword });
                const updatedUser = await getDoc(userRef);
                localStorage.setItem('ultra_user', JSON.stringify(updatedUser.data()));
                
                alert("✅ Master Password Set Ho Gaya! VIP Login Approved.");
                
                // Seedha dashboard pe entry
                localStorage.setItem('userPhone', window.tempPhone);
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html';

            } catch (e) {
                alert("Error: " + e.message);
            }
            document.getElementById('auth-loader').classList.add('hidden');
        };
    </script>
</body>
</html>
