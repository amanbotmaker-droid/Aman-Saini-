        const t = themes[currentTheme];

        if (currentTheme !== 'gold') {
            const style = document.createElement('style');
            style.id = 'vip-theme-engine';
            style.innerHTML = `

            if(!myPhone) return;

            }

        loadMyBalance();

            let ph = document.getElementById('receiver-phone').value.trim();
            const nameEl = document.getElementById('receiver-name');
            
            if(ph.length >= 10) {
                nameEl.innerText = "🔍 Verifying...";
                nameEl.className = "text-[10px] mt-2 ml-2 font-bold text-yellow-500 animate-pulse";
                
                let searchPhone1 = ph; 
                let searchPhone2 = ph.length === 10 ? "+91" + ph : ph;

                    let docSnap = await getDoc(doc(db, "users", searchPhone1));

                        docSnap = await getDoc(doc(db, "users", searchPhone2));

        const rBal = Number(rDoc.data().balance || 0);

        if (sBal < amt) throw "Insufficient Balance!";

        // Balance Update karo
        transaction.update(myRef, { balance: sBal - amt });
        transaction.update(toRef, { balance: rBal + amt });

        };
