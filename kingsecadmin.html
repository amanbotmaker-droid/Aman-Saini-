    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc,setDoc, updateDoc, collection, addDoc, getDocs, deleteDoc, increment, query, where, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🚨 TERA FIREBASE CONFIG YAHAN AAYEGA 🚨
        const firebaseConfig = {
            apiKey: "AIzaSyAw6aKP8je-DzvengJ-ffxtez6xZFpQFn4",
  authDomain: "king-wallet-49888.firebaseapp.com",
  projectId: "king-wallet-49888",
  storageBucket: "king-wallet-49888.firebasestorage.app",
  messagingSenderId: "698310935797",
  appId: "1:698310935797:web:85e03b49237225a7b371bc",
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;

        // --- LOGIN LOCK LOGIC ---
        window.checkBossPin = () => {
            const pin = document.getElementById('boss-pin').value;
            if(pin === "9770") { 
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                window.loadAdminStats();  // Dashboard update karo
            } else {
                alert("❌ WRONG PIN! Tum Boss nahi ho.");
                document.getElementById('boss-pin').value = "";
            }
        };

        // ==========================================
        // --- KING ADMIN PANEL VIP ENGINE ---
        // ==========================================

        // 1. Stats aur Dashboard Live Load Karna (SMART BYPASS)
        window.loadAdminStats = async () => {
            document.getElementById('admin-tot-users').innerText = "...";
            document.getElementById('admin-tot-txns').innerText = "...";
            document.getElementById('admin-tot-bal').innerText = "₹...";
            document.getElementById('admin-api-vol').innerText = "₹...";

            try {
                // Pehle "Hidden Memory" check karo
                let offsetTxns = 0;
                let offsetVol = 0;
                const memorySnap = await getDoc(doc(db, "adminConfig", "resetMemory"));
                if (memorySnap.exists()) {
                    offsetTxns = memorySnap.data().hiddenTxns || 0;
                    offsetVol = memorySnap.data().hiddenVol || 0;
                }

                const usersCol = collection(db, "users");
                const transCol = collection(db, "transactions"); 

                const userCountSnap = await getCountFromServer(usersCol);
                const transCountSnap = await getCountFromServer(transCol);
                
                let rawTxns = transCountSnap.data().count;
                let displayTxns = rawTxns - offsetTxns; // Purane load ko hide karo
                if (displayTxns < 0) displayTxns = 0;

                document.getElementById('admin-tot-users').innerText = userCountSnap.data().count;
                document.getElementById('admin-tot-txns').innerText = displayTxns; // Zero dikhayega

                const userSnap = await getDocs(usersCol);
                let todayCount = 0;
                let todayDate = new Date().toISOString().split('T')[0];
                let totalBal = 0;

                userSnap.forEach(doc => { 
                    const userData = doc.data();
                    totalBal += Number(userData.balance || 0); 
                    if(userData.joinDate === todayDate) { todayCount++; }
                });

                document.getElementById('admin-tot-bal').innerText = "₹" + totalBal.toFixed(2);
                if(document.getElementById('admin-today-users')) {
                    document.getElementById('admin-today-users').innerText = todayCount;
                }

                const histSnap = await getDocs(collection(db, "history"));
                let rawVol = 0;
                histSnap.forEach(doc => { rawVol += Number(doc.data().amt || 0); });
                
                let displayVol = rawVol - offsetVol; // Purane volume ko hide karo
                if (displayVol < 0) displayVol = 0;
                
                document.getElementById('admin-api-vol').innerText = "₹" + displayVol; // Zero dikhayega

            } catch(e) { console.log("Stats error: ", e); }
        };

        // 2. 🚀 VIP TAB SWITCHER ENGINE (Sab kuch ek hi engine handle karega) 🚀
        window.showAdminTab = async (type) => {
            const statsGrid = document.getElementById('admin-stats-grid');
            const reqContainer = document.getElementById('admin-request-container');
            const listTitle = document.getElementById('admin-list-title');
            const listArea = document.getElementById('admin-requests-list');
            const reqCount = document.getElementById('admin-req-count');

            if (type === 'STATS') {
                statsGrid.classList.remove('hidden');
                reqContainer.classList.add('hidden');
                window.loadAdminStats(); 
                return;
            }

            statsGrid.classList.add('hidden');
            reqContainer.classList.remove('hidden');
            
            listTitle.innerText = type === 'USERS' ? 'MANAGE ALL USERS' : `PENDING ${type}S`;
            listArea.innerHTML = '<p class="text-center text-gray-400 py-10 animate-pulse">Fetching Data from Database...</p>';
            reqCount.innerText = "0";

            try {
                let snap;
                if (type === 'USERS') {
                    snap = await getDocs(collection(db, "users"));
                } else {
                    const q = query(collection(db, "transactions"), where("type", "==", type), where("status", "==", "PENDING"));
                    snap = await getDocs(q);
                }

                reqCount.innerText = snap.size;
                listArea.innerHTML = ""; 

                if (snap.empty) {
                    listArea.innerHTML = `<div class="text-center py-10"><p class="text-gray-400">No Data Found!</p></div>`;
                    return;
                }

                let html = "";
                // Agar tab USERS ka hai toh top par Search Bar laga do
                if (type === 'USERS') {
                    html += `
                    <div class="mb-4 sticky top-0 z-10">
                        <input type="text" id="user-search-input" onkeyup="window.searchUsers()" placeholder="🔍 Search Mobile Number..." class="w-full bg-white border border-gray-200 p-3.5 rounded-xl text-sm font-black focus:outline-none focus:border-blue-500 shadow-sm text-slate-800 placeholder-gray-400 tracking-widest">
                    </div>`;
                }

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    if (type === 'USERS') {
                        // VIP USERS CARD
                        const bal = data.balance ? Number(data.balance) : 0;
                        html += `
                        <div class="user-card-item bg-white p-4 rounded-xl mb-3 border-l-4 border-blue-500 shadow-sm border border-gray-100" data-phone="${docSnap.id}">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-slate-800 font-black text-sm">${(data.name || 'VIP User').toUpperCase()}</p>
                                    <p class="text-gray-400 text-[10px] font-bold">${docSnap.id}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-blue-600 font-black">₹${bal}</p>
                                    <div class="flex gap-2 mt-2">
                                        <button onclick="window.manualAdjust('${docSnap.id}', 'ADD')" class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded text-[10px] font-black uppercase">ADD</button>
                                        <button onclick="window.manualAdjust('${docSnap.id}', 'CUT')" class="bg-red-50 text-red-600 px-3 py-1 rounded text-[10px] font-black uppercase">CUT</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    } else {
                        // VIP WITHDRAW / DEPOSIT CARD
                        const uPhone = data.userPhone || data.phone || 'N/A';
                        const uAmt = data.amount || 0;
                        const uDetail = type === 'DEPOSIT' ? (data.utr || 'N/A') : (data.upi || 'N/A');
                        const borderColor = type === 'DEPOSIT' ? 'border-green-500' : 'border-red-500';
                        
                        html += `
                        <div class="bg-white p-4 rounded-xl mb-3 border-l-4 ${borderColor} shadow-sm border border-gray-100">
                            <div class="flex justify-between items-center mb-3">
                                <div>
                                    <p class="text-[10px] font-black text-gray-400 uppercase">User: ${uPhone}</p>
                                    <p class="text-xl font-black text-slate-800">₹${uAmt}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black ${type === 'DEPOSIT' ? 'text-green-500' : 'text-red-500'} uppercase mb-1">DETAIL: <br>${uDetail}</p>
                                    ${type === 'WITHDRAW' ? `<button onclick="navigator.clipboard.writeText('${uDetail}'); alert('✅ UPI Copied: ${uDetail}')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded text-[9px] font-bold transition"><i class="fa-regular fa-copy"></i> Copy</button>` : ''}
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.approveReq('${docSnap.id}', '${uPhone}', ${uAmt}, '${type}')" class="flex-1 bg-green-50 text-green-600 py-2 rounded-lg text-xs font-black uppercase">APPROVE</button>
                                <button onclick="window.rejectReq('${docSnap.id}', '${uPhone}', ${uAmt}, '${type}')" class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-xs font-black uppercase">REJECT</button>
                            </div>
                        </div>`;
                    }
                });
                listArea.innerHTML = html; 

            } catch (e) {
                listArea.innerHTML = `<div class="text-center py-10 text-red-500">Error! Refresh the page.</div>`;
            }
        };

        // 3. Approve Request Logic
        window.approveReq = async (id, phone, amt, type) => {
            if(!confirm(`Are you sure you want to APPROVE this ₹${amt} ${type}?`)) return;
            try {
              if(type === 'DEPOSIT') {
            const userRef = doc(db, "users", phone);
            const userSnap = await getDoc(userRef);
            
            // Asli balance nikalo aur number banao
            let currentBal = userSnap.exists() ? (parseFloat(userSnap.data().balance) || 0) : 0;
            let depositAmt = parseFloat(amt) || 0;
            
            // Safe tarike se plus karo
            let newBal = (currentBal + depositAmt).toFixed(2);
            
            // Naya balance database mein daalo
            await updateDoc(userRef, { balance: newBal });
              }
                
                await updateDoc(doc(db, "transactions", id), { status: 'SUCCESS' });
                alert("✅ Approved Successfully!");
                
                window.showAdminTab(type); // List refresh
                window.sendUserBotAlert(phone, amt, "APPROVED", type);
            } catch(e) { alert(e.message); }
        };

        // 4. Reject Request Logic
        window.rejectReq = async (id, phone, amt, type) => {
            if(!confirm(`Reject this ₹${amt} ${type} request?`)) return;
            try {
                        if(type === 'WITHDRAW') {
            // NAYA SAFE REFUND ENGINE
            const userRef = doc(db, "users", phone);
            const userSnap = await getDoc(userRef);
            
            let currentBal = userSnap.exists() ? (parseFloat(userSnap.data().balance) || 0) : 0;
            let refundAmt = parseFloat(amt) || 0;
            let newBal = (currentBal + refundAmt).toFixed(2);
            
            await updateDoc(userRef, { balance: newBal });
                        }
                
                await updateDoc(doc(db, "transactions", id), { status: 'REJECTED' });
                alert("❌ Rejected!");
                
                window.showAdminTab(type); // List refresh
                window.sendUserBotAlert(phone, amt, "REJECTED", type);
            } catch(e) { alert(e.message); }
        };

        // 5. Manual Balance Add/Cut Engine (Safe Engine)
        window.manualAdjust = async (phone, action) => {
            const amt = prompt(`Enter Amount to ${action === 'ADD' ? 'Add' : 'Cut'} for user ${phone}:`);
            if (!amt || isNaN(amt) || Number(amt) <= 0) return;

            const finalAmt = Number(amt);
            const adjustValue = action === 'ADD' ? finalAmt : -finalAmt;

            try {
        // NAYA SAFETY LOCK: Purana balance nikal kar math karenge
        const userRef = doc(db, "users", phone);
        const userSnap = await getDoc(userRef);
        let currentBal = userSnap.exists() ? (parseFloat(userSnap.data().balance) || 0) : 0;
        
        let newBal = (currentBal + adjustValue).toFixed(2);
        await updateDoc(userRef, { balance: newBal });

                // History generate karo taaki proof rahe
                await addDoc(collection(db, "history"), {
                    owner: phone,
                    amt: finalAmt,
                    type: action === 'ADD' ? 'DEPOSIT' : 'WITHDRAW',
                    status: 'SUCCESS',
                    sender: action === 'ADD' ? 'Admin Bonus' : 'Admin Cut',
                    timestamp: Date.now()
                });

                alert(`✅ ₹${finalAmt} successfully ${action === 'ADD' ? 'Added' : 'Cut'}!`);
                window.showAdminTab('USERS'); // Panel wapas turant refresh karo
            } catch (e) { alert("Error: " + e.message); }
        };

        // ==========================================
// ⛔ VIP FRAUD CONTROL (BAN/UNBAN) ENGINE ⛔
// ==========================================
window.banUser = async () => {
    let phoneInput = document.getElementById('fraud-phone-input').value.trim();
    if (!phoneInput) return alert("❌ Pehle user ka phone number daalo!");

    const confirmBan = confirm(`⚠️ WARNING: Kya aap sach mein ${phoneInput} ko BAN karna chahte hain? Wo bot/app use nahi kar payega!`);
    if (!confirmBan) return;

    try {
        // DHYAN DE: Agar tere users collection mein phone number "userPhone" naam se save hota hai, toh niche "phone" ki jagah "userPhone" kar dena.
        const q = query(collection(db, "users"), where("phone", "==", phoneInput));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
            return alert("❌ Ye number database mein nahi mila! Check karo.");
        }

        querySnapshot.forEach(async (docSnap) => {
            await updateDoc(doc(db, "users", docSnap.id), {
                isBanned: true,
                status: "BANNED ⛔"
            });
        });

        alert(`✅ BOOM! ${phoneInput} has been BANNED permanently.`);
        document.getElementById('fraud-phone-input').value = ""; // Box clear karo
        
    } catch (error) {
        console.error("Ban Error:", error);
        alert("❌ Error: " + error.message);
    }
};

window.unbanUser = async () => {
    let phoneInput = document.getElementById('fraud-phone-input').value.trim();
    if (!phoneInput) return alert("❌ Pehle user ka phone number daalo!");

    try {
        const q = query(collection(db, "users"), where("phone", "==", phoneInput));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
            return alert("❌ Ye number database mein nahi mila!");
        }

        querySnapshot.forEach(async (docSnap) => {
            await updateDoc(doc(db, "users", docSnap.id), {
                isBanned: false,
                status: "ACTIVE ✅"
            });
        });

        alert(`✅ SUCCESS! ${phoneInput} ab UNBAN ho gaya hai aur wapas use kar sakta hai.`);
        document.getElementById('fraud-phone-input').value = ""; 
        
    } catch (error) {
        console.error("Unban Error:", error);
        alert("❌ Error: " + error.message);
    }
};

window.resetApiData = async () => {
    const confirm1 = confirm("⚠️ DASHBOARD RESET: Kya aap API Volume aur Transactions ko 0 se shuru karna chahte hain? (Users ka data safe rahega)");
    if (!confirm1) return;

    document.getElementById('admin-tot-txns').innerText = "Wiping...";
    document.getElementById('admin-api-vol').innerText = "Wiping...";

    try {
        // 1. Abhi tak ka current load check karo
        const transCountSnap = await getCountFromServer(collection(db, "transactions"));
        const currentTxns = transCountSnap.data().count;

        const histSnap = await getDocs(collection(db, "history"));
        let currentVol = 0;
        histSnap.forEach(doc => { currentVol += Number(doc.data().amt || 0); });

        // 2. In purane numbers ko ek "Hidden Memory" mein save kar do (Data delete nahi hoga)
        await setDoc(doc(db, "adminConfig", "resetMemory"), {
            hiddenTxns: currentTxns,
            hiddenVol: currentVol
        }, { merge: true });

        alert("✅ BOOM! Dashboard Display 0 par set ho gaya hai. Users ki history 100% safe hai!");
        window.loadAdminStats(); // Dashboard turant refresh hoga

    } catch (error) {
        console.error("Wipe Error: ", error);
        alert("❌ Error: " + error.message);
    }
};
