<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Themes - King Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: white; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-10">

    <div class="px-6 py-5 flex items-center gap-4 sticky top-0 z-20 bg-black/80 backdrop-blur-md border-b border-gray-800">
        <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-gray-900 border border-gray-700 rounded-xl flex items-center justify-center text-white active:scale-95 transition-all">
            <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <h1 class="text-xl font-black tracking-widest text-white uppercase">App Themes</h1>
    </div>

    <div class="px-5 mt-6 space-y-6">

        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-white tracking-widest uppercase italic mb-2">Personalize</h2>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.2em]">Select your VIP Vibe</p>
        </div>

        <div onclick="window.setKingTheme('skyblue')" class="relative overflow-hidden bg-gradient-to-br from-sky-400 to-blue-600 rounded-3xl p-6 shadow-[0_10px_40px_rgba(56,189,248,0.4)] cursor-pointer active:scale-95 transition-transform border border-sky-300">
            <div class="absolute -right-10 -top-10 text-white/20 text-[8rem]"><i class="fa-solid fa-cloud"></i></div>
            <div class="relative z-10 flex justify-between items-center">
                <div>
                    <h3 class="text-2xl font-black text-white uppercase tracking-widest drop-shadow-md">Sky Blue</h3>
                    <p class="text-[10px] text-sky-100 font-bold uppercase tracking-[0.2em] mt-1">Light & Fresh (Recommended)</p>
                </div>
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-inner text-sky-500 text-xl">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
        </div>

        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.2em] pt-4 pl-2 border-b border-gray-800 pb-2">More Premium Themes</p>

        <div class="grid grid-cols-2 gap-4">
            
            <div onclick="window.setKingTheme('gold')" class="bg-gray-900 p-4 rounded-2xl border border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.15)] cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-yellow-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-yellow-500 uppercase tracking-widest">Mafia Gold</h4>
                <p class="text-[8px] text-gray-500 uppercase mt-1">Original</p>
            </div>

            <div onclick="window.setKingTheme('emerald')" class="bg-gray-900 p-4 rounded-2xl border border-emerald-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-emerald-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-emerald-400 uppercase tracking-widest">Hacker Matrix</h4>
            </div>

            <div onclick="window.setKingTheme('pink')" class="bg-gray-900 p-4 rounded-2xl border border-pink-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-pink-400 to-pink-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-pink-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-pink-400 uppercase tracking-widest">Neon Vice</h4>
            </div>

            <div onclick="window.setKingTheme('purple')" class="bg-gray-900 p-4 rounded-2xl border border-purple-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-purple-400 to-purple-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-purple-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-purple-400 uppercase tracking-widest">Royal Crown</h4>
            </div>

            <div onclick="window.setKingTheme('red')" class="bg-gray-900 p-4 rounded-2xl border border-red-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-red-400 to-red-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-red-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-red-500 uppercase tracking-widest">Blood Ruby</h4>
            </div>

            <div onclick="window.setKingTheme('cyan')" class="bg-gray-900 p-4 rounded-2xl border border-cyan-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-cyan-400 to-cyan-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-cyan-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-cyan-400 uppercase tracking-widest">Sci-Fi Tron</h4>
            </div>

            <div onclick="window.setKingTheme('orange')" class="bg-gray-900 p-4 rounded-2xl border border-orange-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-orange-400 to-orange-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-orange-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-orange-500 uppercase tracking-widest">Sunset Fire</h4>
            </div>

            <div onclick="window.setKingTheme('silver')" class="bg-gray-900 p-4 rounded-2xl border border-slate-500/30 cursor-pointer active:scale-95 transition-transform text-center group hover:bg-gray-800">
                <div class="w-12 h-12 mx-auto bg-gradient-to-br from-slate-400 to-slate-600 rounded-full mb-3 shadow-inner shadow-black border-2 border-slate-300 group-hover:scale-110 transition-transform"></div>
                <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest">Platinum</h4>
            </div>

        </div>
    </div>

    <script>
        window.setKingTheme = (themeName) => {
            localStorage.setItem('king_theme', themeName);
            window.location.href = 'index.html'; // Set hote hi index pe bhejo taaki asar dikhe!
        }
    </script>
</body>
</html>
