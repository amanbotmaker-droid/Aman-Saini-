    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050505; color: white; }

        .gold { color: #f59e0b; }

        .active-scale:active { transform: scale(0.95); transition: 0.2s; }
    </style>
        <!-- 👑 MASTER THEME ENGINE 👑 -->
    <script>
    (function() {
        // 10+ VIP Colors Setup
        const themes = {
            'gold': { 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
            'skyblue': { 300: '#e0f2fe', 400: '#7dd3fc', 500: '#0ea5e9', 600: '#0284c7' }, // Tera Favourite
            'emerald': { 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669' },
            'pink': { 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777' },
            'purple': { 300: '#d8b4fe', 400: '#c084fc', 500: '#a855f7', 600: '#9333ea' },
            'red': { 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626' },
            'cyan': { 300: '#67e8f9', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
            'orange': { 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
            'blue': { 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
            'silver': { 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569' }
        };

        const currentTheme = localStorage.getItem('king_theme') || 'gold';
        const t = themes[currentTheme];

        // Agar theme Gold nahi hai, toh automatic CSS inject karke pure app ka colour badal do
        if (currentTheme !== 'gold') {
            const style = document.createElement('style');
            style.id = 'vip-theme-engine';
            style.innerHTML = `
                :root { --t-300: ${t[300]}; --t-400: ${t[400]}; --t-500: ${t[500]}; --t-600: ${t[600]}; }
                
                /* Text Overrides */
                .text-yellow-300, .text-yellow-400 { color: var(--t-400) !important; }
                .text-yellow-500, .gold { color: var(--t-500) !important; }
                .text-yellow-600 { color: var(--t-600) !important; }
                .text-yellow-500\\/70 { color: color-mix(in srgb, var(--t-500) 70%, transparent) !important; }
                .text-yellow-500\\/80 { color: color-mix(in srgb, var(--t-500) 80%, transparent) !important; }
                
                /* Background Overrides */
                .bg-yellow-400 { background-color: var(--t-400) !important; }
                .bg-yellow-500 { background-color: var(--t-500) !important; }
                .bg-yellow-600 { background-color: var(--t-600) !important; }
                .bg-yellow-500\\/10 { background-color: color-mix(in srgb, var(--t-500) 10%, transparent) !important; }
                .bg-yellow-500\\/20 { background-color: color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                
                /* Border & Gradient Overrides */
                .border-yellow-400 { border-color: var(--t-400) !important; }
                .border-yellow-500 { border-color: var(--t-500) !important; }
                .border-yellow-600 { border-color: var(--t-600) !important; }
                .border-yellow-500\\/20 { border-color: color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                .border-yellow-500\\/30 { border-color: color-mix(in srgb, var(--t-500) 30%, transparent) !important; }
                .border-yellow-500\\/50 { border-color: color-mix(in srgb, var(--t-500) 50%, transparent) !important; }
                
                .from-yellow-300 { --tw-gradient-from: var(--t-300) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
                .from-yellow-400 { --tw-gradient-from: var(--t-400) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
                .from-yellow-500 { --tw-gradient-from: var(--t-500) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
                .to-yellow-600 { --tw-gradient-to: var(--t-600) !important; }
                .to-yellow-500 { --tw-gradient-to: var(--t-500) !important; }
                
                /* Shadows & Glows */
                [class*="shadow-[0_0_10px_rgba(234,179,8"] { box-shadow: 0 0 10px color-mix(in srgb, var(--t-500) 30%, transparent) !important; }
                [class*="shadow-[0_0_15px_rgba(245,158,11"] { box-shadow: 0 0 15px color-mix(in srgb, var(--t-500) 30%, transparent) !important; }
                [class*="shadow-[0_0_20px_rgba(245,158,11"] { box-shadow: 0 0 20px color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                [class*="shadow-[0_10px_30px_rgba(234,179,8"] { box-shadow: 0 10px 30px color-mix(in srgb, var(--t-500) 15%, transparent) !important; }
                [class*="shadow-[0_0_40px_rgba(234,179,8"] { box-shadow: 0 0 40px color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                [class*="shadow-[0_5px_15px_rgba(234,179,8"] { box-shadow: 0 5px 15px color-mix(in srgb, var(--t-500) 20%, transparent) !important; }
                
                /* Extra Specific fixes */
                .theme-icon-dynamic { color: var(--t-500) !important; }
            `;
            document.head.appendChild(style);
        }

        window.setKingTheme = (themeName) => {
            localStorage.setItem('king_theme', themeName);
            window.location.reload(); // Set hote hi turant page refresh hokar naya colour aayega
        }
    })();
    </script>
