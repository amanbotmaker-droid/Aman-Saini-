<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security - King Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050505; color: white; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .gold { color: #f59e0b; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-left-color: #f59e0b; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input:focus { border-color: #f59e0b !important; outline: none; box-shadow: 0 0 15px rgba(245, 158, 11, 0.1); }
        input::placeholder { font-size: 10px; letter-spacing: 1px; }
    </style>
</head>
<body class="flex justify-center">

    <div class="w-full max-w-md min-h-screen border-x border-slate-900 pb-20 relative">
        <div id="global-loader" class="hidden absolute inset-0 bg-black/80 z-[100] flex flex-col items-center justify-center">
            <div class="loader !block mb-4"></div>
            <p class="text-[10px] font-black tracking-widest text-yellow-500 uppercase animate-pulse">Verifying Security...</p>
        </div>

        <div class="p-5 flex items-center border-b border-white/5 sticky top-0 bg-black/80 z-50">
            <button onclick="window.location.href='index.html'" class="h-10 w-10 glass rounded-full flex items-center justify-center mr-4 gold active:scale-90 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-xs font-black uppercase gold tracking-[2px]">Security Settings</h1>
        </div>

        <div class="p-6 space-y-6">
            <div class="glass p-6 rounded-[2.5rem] border-yellow-500/20 border text-center space-y-4 shadow-2xl shadow-yellow-500/5">
                <div class="h-16 w-16 bg-yellow-500/10 rounded-full flex items-center justify-center text-yellow-500 mx-auto border border-yellow-500/20">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h2 class="text-sm font-black uppercase italic gold">Update Security PIN</h2>
                <p class="text-[10px] text-gray-500 leading-relaxed uppercase tracking-tighter">Enter your current PIN to authorize the change.</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-500 uppercase ml-2 tracking-widest">Current 4-Digit PIN</label>
                    <input type="password" id="old-pin" maxlength="4" inputmode="numeric" placeholder="Enter Old PIN" 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-center text-lg font-black tracking-[10px] focus:border-yellow-500 transition-all text-yellow-500">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-500 uppercase ml-2 tracking-widest">New Security PIN</label>
                    <input type="password" id="new-pin" maxlength="4" inputmode="numeric" placeholder="Set New PIN" 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-center text-lg font-black tracking-[10px] focus:border-yellow-500 transition-all text-yellow-500">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-500 uppercase ml-2 tracking-widest">Confirm New PIN</label>
                    <input type="password" id="confirm-pin" maxlength="4" inputmode="numeric" placeholder="Confirm New PIN" 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-center text-lg font-black tracking-[10px] focus:border-yellow-500 transition-all text-yellow-500">
                </div>

                <button onclick="handlePinUpdate()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl shadow-lg shadow-yellow-600/20 active:scale-95 transition-all uppercase tracking-widest text-[11px] mt-4">
                    Authorize PIN Update
                </button>
            </div>

            <div class="glass p-4 rounded-2xl border-l-4 border-red-500/50">
                <p class="text-[9px] font-black text-red-500 uppercase mb-1">Important</p>
                <p class="text-[9px] text-gray-400 uppercase tracking-tighter italic">PIN badalne ke baad use kahin safe jagah save kar lein. PIN bhulne par balance recover karna mushkil ho sakta hai.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAw6aKP8je-DzvengJ-ffxtez6xZFpQFn4",
  authDomain: "king-wallet-49888.firebaseapp.com",
  projectId: "king-wallet-49888",
  storageBucket: "king-wallet-49888.firebasestorage.app",
  messagingSenderId: "698310935797",
  appId: "1:698310935797:web:85e03b49237225a7b371bc",
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const myPhone = localStorage.getItem('userPhone');

        window.handlePinUpdate = async () => {
            const oldP = document.getElementById('old-pin').value;
            const newP = document.getElementById('new-pin').value;
            const conP = document.getElementById('confirm-pin').value;

            if(!oldP || !newP || !conP) return alert("Bhai, saare boxes bharo!");
            if(newP.length < 4) return alert("PIN kam se kam 4 digit ka hona chahiye!");
            if(newP !== conP) return alert("Naya PIN aur Confirm PIN match nahi ho rahe!");

            // Start Loader
            document.getElementById('global-loader').classList.remove('hidden');

            try {
                const userRef = doc(db, "users", myPhone);
                const userSnap = await getDoc(userRef);

                if(userSnap.exists()) {
                    const currentPin = userSnap.data().pin;

                    if(currentPin.toString() === oldP.toString()) {
                        // Success: Update in Firebase
                        await updateDoc(userRef, { pin: newP });
                        alert("✅ Security PIN Successfully Updated!");
                        window.location.href = 'index.html';
                    } else {
                        alert("❌ Purana PIN galat hai!");
                    }
                }
            } catch (e) {
                alert("Error: " + e.message);
            }

            // Stop Loader
            document.getElementById('global-loader').classList.add('hidden');
        };
    </script>
</body>
</html>
